[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blake"
dynamic = ["version"]
description = "Target-aware corpus acquisition, analysis, and completeness accounting for William Blake research"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
]
keywords = ["william-blake", "literature", "digital-humanities", "nlp", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "packaging>=23.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pandas>=2.0.0",
    "numpy<2.0.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8.0",
    "spacy>=3.6.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "sqlalchemy>=2.0.0",
    "pyarrow>=12.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "tqdm>=4.65.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
    "truststore>=0.10; python_version >= '3.10'",
    "scrapy>=2.10.0",
    "selenium>=4.10.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "psutil>=7.0.0",
    "en-core-web-sm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]
gui = [
    "streamlit>=1.25.0",
    "gradio>=3.40.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[project.urls]
Homepage = "https://github.com/docxology/blake"
Documentation = "https://blake.readthedocs.io"
Repository = "https://github.com/docxology/blake"
Issues = "https://github.com/docxology/blake/issues"

[project.scripts]
blake = "blake.cli:main"
blake-text = "blake.text_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["blake"]

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "blake/_resources/uv.lock"

[tool.hatch.version]
path = "blake/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/blake", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE",
    "/CITATION.cff", "/codemeta.json", "/.zenodo.json", "/CHANGELOG.md",
    "/DESIGN.md", "/docs/methods.md", "/docs/text-search.md",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/AGENTS.md"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=blake",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
